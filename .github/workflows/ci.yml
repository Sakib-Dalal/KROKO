name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Lints, denying warnings
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Regression corpus
        working-directory: rust
        run: cargo test

      - name: The gate must catch a known-bad file
        run: |
          set +e
          ./rust/target/debug/kroko tests/fixtures/bad_recursion.py > report.txt
          status=$?
          set -e
          cat report.txt
          test "$status" -eq 1
          grep -q "K001" report.txt

      - name: The gate must pass a known-good file
        run: ./rust/target/debug/kroko --strict-comments tests/fixtures/good_clean.py
